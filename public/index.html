<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Open Graph tags so shared links (WhatsApp, etc.) get a branded
         preview. Static SPA export: one global preview for every route;
         per-tournament previews would need SSR (out of scope). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Golf Partner" />
    <meta property="og:title" content="Golf Partner" />
    <meta property="og:description" content="Live scores, leaderboards and stats for weekend golf tournaments." />
    <meta property="og:image" content="https://golf-partner.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
